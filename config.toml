base_url = "https://brandoncharest.dev"
theme = "apollo"
title = "brandoncharest.dev"
description = "Senior Backend Engineer constantly learning and building new things."
taxonomies = [{ name = "tags" }]
compile_sass = true
minify_html = true
# The command palette ships its own compact index (templates/search_index.xml);
# Zola's elasticlunr index was 1.2 MB and indexed page bodies we never match on.
build_search_index = false
generate_sitemap = true
generate_robots_txt = true
generate_feeds = true
feed_filenames = ["atom.xml", "search_index.xml"]


[markdown]
highlight_code = true
# Zola 0.17 bundles no Gruvbox theme, so we ship one and let Zola export it to
# CSS classes. "css" also stops Zola inlining a background/foreground on every
# <pre>, which let the code card own its own surface.
highlight_theme = "css"
highlight_themes_css = [{ theme = "gruvbox-dark", filename = "syntax-theme-dark.css" }]
extra_syntaxes_and_themes = ["highlight_themes"]
# Adds loading="lazy" decoding="async" to markdown images.
lazy_async_image = true

[extra]
# Dark-only. There is no light palette to switch to, so no theme class, no
# toggle script, and no theme stylesheet links — tokens live on :root.
# Enables static/js/codeblock.js, which builds the code card (filename tab,
# language label, line-number gutter) around Zola's <pre>.
fancy_code = true
mathjax = true
mathjax_dollar_inline_enable = true
favicon = "images/favicon.ico"
# Fallback social card. Needs a purpose-made 1200x630 asset; until one
# exists, pages without a cover_image fall back to a text-only card.
# default_og_image = "images/og-default.png"

# Nav order drives the 1-5 keyboard shortcuts, so weight is the index.
# URLs keep their trailing slash so nav links match the permalinks Zola
# generates; without it every nav click costs a 301 redirect.
menu = [
    { name = "home", url = "/", weight = 0 },
    { name = "garden", url = "/garden/", weight = 1 },
    { name = "blog", url = "/blog/", weight = 2 },
    { name = "now", url = "/now/", weight = 3 },
    { name = "about", url = "/about/", weight = 4 },
]

location = "Boston, MA"
branch = "main"

# `short` is the status-bar label; the header has no socials slot in the
# redesign, so these render as `gh` / `in` text links down there instead.
socials = [
    { name = "GitHub", url = "https://github.com/brandon-charest", icon = "github", short = "gh" },
    { name = "LinkedIn", url = "https://www.linkedin.com/in/brandon-charest/", icon = "linkedin", short = "in" },
]


# Home neofetch card. Editorial copy only — the Garden line is derived from
# real content in templates/home.html.
# NOTE: sub-tables must stay below every bare key in [extra], or TOML folds the
# following keys into them.
[extra.neofetch]
role = "Senior Backend Engineer"
focus = "Distributed systems & perf"
editor = "neovim btw"
day = "Java · Python · AWS"
night = "Rust · Go"
currently = "building a redis clone, for fun"

[extra.analytics]
enabled = true

[extra.analytics.umami]
website_id = "cd20f040-8743-4a28-b120-2ed87e006b56"
