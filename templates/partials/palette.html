{# Command palette. Opened by the header search button, `/`, or ⌘K / Ctrl+K.
   Markup is inert until js/palette.js loads the index. #}

<div class="palette" id="palette" hidden>
    <div class="palette__scrim" data-palette-close></div>

    <div class="palette__panel" role="dialog" aria-modal="true" aria-label="Search">
        <div class="palette__input-row">
            <span class="palette__slash" aria-hidden="true">/</span>
            <input id="palette-input"
                   class="palette__input"
                   type="text"
                   autocomplete="off"
                   spellcheck="false"
                   role="combobox"
                   aria-label="Search notes, tags and pages"
                   aria-expanded="false"
                   aria-activedescendant=""
                   aria-controls="palette-results"
                   aria-autocomplete="list"
                   placeholder="Search notes, tags, pages…" />
            {# A real button, not an ornament: on touch there is no Esc key, and below
               560px the footer hint that mentions one is hidden. #}
            <button type="button" class="kbd palette__close" data-palette-close aria-label="Close search">esc</button>
        </div>

        <div class="palette__results" id="palette-results" role="listbox" aria-label="Results"></div>

        <div class="palette__foot">
            <span><span class="palette__key">↑↓</span> navigate</span>
            <span><span class="palette__key">↵</span> open</span>
            <span><span class="palette__key">esc</span> close</span>
            <span class="palette__spacer"></span>
            <span id="palette-count" aria-live="polite"></span>
        </div>
    </div>
</div>
